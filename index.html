<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#002d72">
    <title>Baseball Limits 2D</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://d3js.org/d3.v7.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Baseball Limits <span class="brand-accent">2D</span></h1>
            <p class="tagline">The Pareto frontier of MLB batting</p>
        </div>
        <nav class="attribution" aria-label="Data sources">
            <span class="attribution-label">Data</span>
            <a href="http://seanlahman.com/" target="_blank" rel="noopener">Lahman</a>
            <span class="attribution-sep">·</span>
            <a href="https://www.baseball-reference.com/" target="_blank" rel="noopener">Baseball Reference</a>
        </nav>
    </header>

    <main class="app-main">
        <section class="chart-region" aria-label="Scatter plot">
            <div class="legend" aria-hidden="true">
                <span class="legend-item"><span class="legend-dot legend-dot--frontier"></span>Frontier</span>
                <span class="legend-item"><span class="legend-dot legend-dot--season"></span>Season</span>
            </div>
            <div class="loading-indicator" id="loading-indicator" role="status" aria-live="polite">
                <span class="spinner" aria-hidden="true"></span>
                <span>Loading…</span>
            </div>
            <svg id="scatter-plot" role="img" aria-label="Scatter plot of batting statistics with Pareto frontier highlighted">
            </svg>
            <div class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></div>
        </section>

        <aside class="controls-region" aria-label="Filters">
            <button class="controls-toggle" id="controls-toggle" type="button" aria-expanded="false" aria-controls="controls-panel">
                <span>Filters</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>

            <div class="controls-panel collapsed" id="controls-panel">
                <fieldset class="control-group">
                    <legend>Axes</legend>
                    <div class="field-row">
                        <label class="field-label">
                            <span>X-Axis</span>
                            <select id="x-axis-select" class="field"></select>
                        </label>
                        <label class="field-label">
                            <span>Y-Axis</span>
                            <select id="y-axis-select" class="field"></select>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="control-group">
                    <legend>Year Range</legend>
                    <div class="field-row">
                        <label class="field-label">
                            <span>From</span>
                            <input type="number" id="s-year-select" class="field" inputmode="numeric">
                        </label>
                        <label class="field-label">
                            <span>To</span>
                            <input type="number" id="e-year-select" class="field" inputmode="numeric">
                        </label>
                    </div>
                </fieldset>

                <fieldset class="control-group">
                    <legend>
                        <span>Min Plate Appearances</span>
                        <output id="pa-min-value" for="pa-min-select" class="legend-value">0</output>
                    </legend>
                    <input type="range" id="pa-min-select" class="slider" min="0" max="600" step="1" value="0">
                    <div class="preset-row" role="group" aria-label="Plate appearance presets">
                        <button type="button" class="preset" data-pa="0">All</button>
                        <button type="button" class="preset" data-pa="100">100</button>
                        <button type="button" class="preset" data-pa="300">300</button>
                        <button type="button" class="preset" data-pa="502">502</button>
                    </div>
                    <p class="control-hint">502 PA qualifies for the batting title.</p>
                </fieldset>

                <div class="result-summary" id="result-summary" aria-live="polite"></div>
            </div>
        </aside>
    </main>
</body>
</html>
